# Slack App Manifest — GrowthOS
#
# Register this app at https://api.slack.com/apps → "Create New App" → "From a manifest".
# Paste this YAML, then install to your workspace. Rotate/replace the signing secret and
# tokens via Rails credentials (config/credentials.yml.enc) — never commit them.
#
# GrowthOS sends OUTBOUND direct-message notifications today (assessment nudges,
# alignment reminders, evidence-request pings). The scopes that power that — and
# which the OAuth install flow requests via Slack::BOT_SCOPES — are:
#
#   users:read.email  → users.lookupByEmail  (map a Person's email → Slack user id)
#   users:read        → Slack requires it as a companion to users:read.email
#   im:write          → conversations.open   (open the 1:1 DM channel)
#   chat:write        → chat.postMessage      (post the notification into that DM)
#
# ── Reinstall vs. transparent upgrade ──────────────────────────────────────────
# A workspace must RE-AUTHORISE (reinstall) the app ONLY when a new bot *scope*
# is added — existing tokens never gain scopes retroactively. App *settings*
# (interactivity, request URLs, event subscriptions that need no new scope) are
# config and can change with no reinstall.
#
# So that EVERY planned inbound feature can ship later with zero reinstall, the
# scopes they need are all granted up front, even though no code uses them yet:
#
#   chat:write     → post interactive messages, chat.update, views.open (modals)
#   commands       → a /growthos slash-command entry point
#   im:history     → capture a free-text DM reply to an evidence request
#
# With these pre-granted, the remaining work to light up each feature is pure
# CONFIG (no reinstall):
#   • Inline button/modal responses — flip on Interactivity (done below) + build
#     /slack/interactions. Interactivity URLs are NOT challenge-verified, so the
#     placeholder below is safe before the endpoint exists.
#   • Slash command — declare the /growthos command (name + request_url) once its
#     endpoint exists. Slash-command URLs aren't challenge-verified either.
#   • Free-text DM replies — the `message.im` Events subscription is declared
#     below. Events API request_urls ARE challenge-verified the moment they're
#     saved, so this is only importable because Slack::EventsController answers
#     the url_verification challenge (the bot still drops real events until the
#     reply handler is built). The Messages tab is writable so members can reply.
# None of those three steps adds a scope, so none triggers a reinstall.

display_information:
  name: GrowthOS
  description: Career growth framework assistant — assessment nudges, alignment reminders, and growth-plan check-ins.
  background_color: "#1a1a2e"
  long_description: >-
    GrowthOS operationalises career growth frameworks — self-assessments, manager
    alignment conversations, evidence collection, and growth planning. This Slack app
    delivers timely direct-message notifications about your development journey.

features:
  bot_user:
    display_name: GrowthOS
    always_online: true
  # Inbound: the /growthos command and the message shortcut open the feedback
  # modal; both answer through the interactivity URL below. Config only — the
  # `commands` scope was pre-granted, so no reinstall.
  slash_commands:
    - command: /growthos
      description: Give someone feedback
      usage_hint: feedback
      url: https://growthos.work/slack/commands
      should_escape: false
  shortcuts:
    - name: Feedback on this message
      type: message
      callback_id: give_feedback_on_message
      description: Turn this message into feedback for someone in GrowthOS
  app_home:
    # Notifications arrive as DMs and surface in the Messages tab. The tab is
    # writable so members can reply to an evidence-request DM (captured via the
    # message.im subscription below). The Home tab is unused.
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      # Used today — outbound DM notifications:
      - users:read         # Slack requires it as a companion to users:read.email
      - users:read.email   # users.lookupByEmail — match a Person by email
      - im:write           # conversations.open — open the user's DM channel
      - chat:write         # chat.postMessage — deliver the notification (and, later,
                           #   interactive blocks / chat.update / views.open)
      # Pre-granted for planned inbound features so they ship with NO reinstall.
      # No code uses these yet (see the header note); they exist purely so a later
      # config-only change can light up the feature:
      - commands           # a /growthos slash-command entry point
      - im:history         # capture a free-text DM reply to an evidence request

settings:
  interactivity:
    # Enabled now so inline evidence-request responses (buttons + modal) can ship
    # later with zero Slack-side change. This is config, not a scope — no
    # reinstall. The endpoint doesn't exist yet; build it before wiring buttons.
    # Interactivity request URLs are NOT challenge-verified at config time (unlike
    # the Events API). Slack::InteractionsController answers here: the feedback
    # modal's recipient typeahead (options URL below), its submission, and the
    # message shortcut.
    is_enabled: true
    request_url: https://growthos.work/slack/interactions
    message_menu_options_url: https://growthos.work/slack/interactions
  event_subscriptions:
    # Importable because Slack::EventsController answers the url_verification
    # challenge Slack POSTs when this URL is saved. message.im delivers a member's
    # free-text reply to an evidence-request DM; it needs the im:history scope
    # (granted above), so no reinstall. The bot acks + drops these until the
    # reply handler is built.
    request_url: https://growthos.work/slack/events
    bot_events:
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
