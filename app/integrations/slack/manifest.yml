# Slack App Manifest — GrowthOS
#
# Register this app at https://api.slack.com/apps → "Create New App" → "From a manifest".
# Paste this YAML, then install to your workspace. Rotate/replace the signing secret and
# tokens via Rails credentials (config/credentials.yml.enc) — never commit them.
#
# Scope is deliberately minimal: GrowthOS sends OUTBOUND direct-message
# notifications today (assessment nudges, alignment reminders, evidence-request
# pings). The three bot scopes below are exactly what that requires and match
# Slack::BOT_SCOPES, which the OAuth install flow requests:
#
#   users:read.email  → users.lookupByEmail  (map a Person's email → Slack user id)
#   im:write          → conversations.open   (open the 1:1 DM channel)
#   chat:write        → chat.postMessage      (post the notification into that DM)
#
# ── Reinstall vs. transparent upgrade ──────────────────────────────────────────
# A workspace must RE-AUTHORISE (reinstall) the app ONLY when a new bot *scope*
# is added — existing tokens never gain scopes retroactively. App *settings*
# (interactivity, request URLs, event subscriptions that need no new scope) are
# config and can change with no reinstall.
#
# Inline responses to evidence requests — Block Kit buttons + a modal in the DM
# we already send — need NO new scope: posting the interactive message, updating
# it after a click (chat.update), and opening the modal (views.open) all run on
# chat:write, which we already hold. So that feature ships as pure server code.
# To make it fully transparent we enable Interactivity below NOW (config only,
# no reinstall) and point it at the future /slack/interactions endpoint.
#
# The only future Slack features that WOULD force a one-time reinstall are ones
# needing a new scope — e.g. `commands` (slash-command entry point) or
# `im:history` (capturing a free-text DM reply instead of a button/modal). Those
# are intentionally NOT pre-added; add them (and reinstall once) if/when wanted.

display_information:
  name: GrowthOS
  description: Career growth framework assistant — assessment nudges, alignment reminders, and growth-plan check-ins.
  background_color: "#1a1a2e"
  long_description: >-
    GrowthOS operationalises career growth frameworks — self-assessments, manager
    alignment conversations, evidence collection, and growth planning. This Slack app
    delivers timely direct-message notifications about your development journey.

features:
  bot_user:
    display_name: GrowthOS
    always_online: true
  app_home:
    # Notifications arrive as DMs and surface in the Messages tab. We don't
    # process replies, so the tab is read-only and the Home tab is disabled.
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true

oauth_config:
  scopes:
    bot:
      - users:read.email   # users.lookupByEmail — match a Person by email
      - im:write           # conversations.open — open the user's DM channel
      - chat:write         # chat.postMessage — deliver the notification

settings:
  interactivity:
    # Enabled now so inline evidence-request responses (buttons + modal) can ship
    # later with zero Slack-side change. This is config, not a scope — no
    # reinstall. The endpoint doesn't exist yet; build it before wiring buttons.
    # Interactivity request URLs are NOT challenge-verified at config time (unlike
    # the Events API), so this placeholder is safe until the responder ships.
    is_enabled: true
    request_url: https://growthos.work/slack/interactions
  # No event subscriptions: GrowthOS doesn't consume inbound events. Slash
  # commands and free-text-reply capture are deferred — each needs a new scope
  # (`commands` / `im:history`) and thus a one-time reinstall when added.
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
