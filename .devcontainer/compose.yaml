# No service pins `platform:` — every image below publishes a native
# linux/arm64 manifest alongside linux/amd64, so each host resolves its own
# architecture. The chrome-debug and selenium services used to carry
# `platform: linux/amd64` (from before those images shipped arm64 builds),
# which forced Chrome and all four Selenium nodes through emulation on Apple
# Silicon — the slowest part of the suite, running on the slowest possible
# path. Don't reintroduce a pin without checking `docker manifest inspect`
# first; CI doesn't use this file, so a pin only ever costs local developers.
services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Uncomment the next line to use a non-root user for all processes.
    user: vscode

    environment:
      DB_HOST: postgres
      SELENIUM_HOST: selenium-hub
      # Must sit BELOW the Linux ephemeral port range (32768–60999, see
      # net.ipv4.ip_local_port_range): each test worker binds base+worker as a
      # fixed port, and an ephemeral-range pin collides with whatever outbound
      # connection happens to hold that local port (recurring mid-suite
      # Errno::EADDRINUSE on "rails-app").
      CAPYBARA_SERVER_PORT: "28100"
      SYSTEM_TEST_WORKERS: "4"

    depends_on:
    - selenium-hub
    - postgres
    - chrome-debug

  # Headless Chrome exposed over CDP for chrome-devtools-mcp. Separate
  # from the Selenium nodes (those only run Chrome inside an active
  # WebDriver session and don't expose a stable /json/version
  # endpoint). The MCP server connects to http://chrome-debug:9222
  # and drives this instance.
  #
  # chromedp/headless-shell's default entrypoint already runs Chrome
  # on 127.0.0.1:9223 + a socat proxy listening on 0.0.0.0:9222 that
  # forwards to it (the socat trick sidesteps Chrome 111+'s DNS-
  # rebinding Host-header guard). DO NOT override `command:` — that
  # appends flags that duplicate the port and break the proxy.
  chrome-debug:
    image: chromedp/headless-shell:latest
    restart: unless-stopped
    # Extra flag only — the image's entrypoint appends `command:` to
    # its own defaults. `--remote-allow-origins=*` lifts Chrome 111+'s
    # Host-header check so requests with `Host: chrome-debug:9222`
    # (what chrome-devtools-mcp sends through Puppeteer) are accepted.
    # Don't pass --remote-debugging-port here — it would override the
    # image's internal 9223 and collide with socat's 9222 listener.
    command:
      - --remote-allow-origins=*

  selenium-hub:
    image: selenium/hub:latest
    restart: unless-stopped
    environment:
      GRID_MAX_SESSION: 4
      GRID_BROWSER_TIMEOUT: 120
      GRID_TIMEOUT: 120
      SE_SESSION_REQUEST_TIMEOUT: 120

  selenium-node-1:
    image: selenium/node-chromium:latest
    restart: unless-stopped
    shm_size: 1g
    depends_on:
    - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_SESSION_TIMEOUT: 120
      JAVA_OPTS: "-Xmx512m"
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 1500m

  selenium-node-2:
    image: selenium/node-chromium:latest
    restart: unless-stopped
    shm_size: 1g
    depends_on:
    - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_SESSION_TIMEOUT: 120
      JAVA_OPTS: "-Xmx512m"
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 1500m

  selenium-node-3:
    image: selenium/node-chromium:latest
    restart: unless-stopped
    shm_size: 1g
    depends_on:
    - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_SESSION_TIMEOUT: 120
      JAVA_OPTS: "-Xmx512m"
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 1500m

  selenium-node-4:
    image: selenium/node-chromium:latest
    restart: unless-stopped
    shm_size: 1g
    depends_on:
    - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_SESSION_TIMEOUT: 120
      JAVA_OPTS: "-Xmx512m"
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 1500m

  postgres:
    image: postgres:16
    restart: unless-stopped
    tmpfs:
    - /var/lib/postgresql/data/pgdata
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata