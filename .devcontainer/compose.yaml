services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Uncomment the next line to use a non-root user for all processes.
    user: vscode

    environment:
      DB_HOST: postgres
      SELENIUM_HOST: selenium-hub
      CAPYBARA_SERVER_PORT: "45678"
      SYSTEM_TEST_WORKERS: "4"

    depends_on:
    - selenium-hub
    - postgres
    - otelcol

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    # Parse the single Authorization header out of OTEL_EXPORTER_OTLP_HEADERS
    # ("Authorization=Bearer …") so the collector config can reference it as
    # ${env:UPSTREAM_AUTHORIZATION}. $$ escapes `$` for docker-compose so the
    # shell (not compose) expands the variable.
    entrypoint:
      - /bin/sh
      - -c
      - |
        export UPSTREAM_AUTHORIZATION="$$(printf %s "$$OTEL_EXPORTER_OTLP_HEADERS" | sed -En 's/^[Aa]uthorization=//p')"
        exec /otelcol-contrib --config=/etc/otelcol/config.yaml
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol/config.yaml:ro

  selenium-hub:
    image: selenium/hub:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      GRID_MAX_SESSION: 4
      GRID_BROWSER_TIMEOUT: 120
      GRID_TIMEOUT: 120
      SE_SESSION_REQUEST_TIMEOUT: 120

  selenium-node-1:
    image: selenium/node-chromium:latest
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 1g
    depends_on:
    - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_SESSION_TIMEOUT: 120
      JAVA_OPTS: "-Xmx512m"
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 1500m

  selenium-node-2:
    image: selenium/node-chromium:latest
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 1g
    depends_on:
    - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_SESSION_TIMEOUT: 120
      JAVA_OPTS: "-Xmx512m"
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 1500m

  selenium-node-3:
    image: selenium/node-chromium:latest
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 1g
    depends_on:
    - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_SESSION_TIMEOUT: 120
      JAVA_OPTS: "-Xmx512m"
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 1500m

  selenium-node-4:
    image: selenium/node-chromium:latest
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 1g
    depends_on:
    - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_SESSION_TIMEOUT: 120
      JAVA_OPTS: "-Xmx512m"
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 1500m

  postgres:
    image: postgres:16
    restart: unless-stopped
    tmpfs:
    - /var/lib/postgresql/data/pgdata
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata