  postgres:
    image: postgres:16
    restart: unless-stopped
    tmpfs:
    - /var/lib/postgresql/data/pgdata
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata