receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: normal
  otlphttp/upstream:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:UPSTREAM_AUTHORIZATION}

service:
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug, otlphttp/upstream]
    metrics:
      receivers: [otlp]
      exporters: [debug, otlphttp/upstream]
    traces:
      receivers: [otlp]
      exporters: [debug, otlphttp/upstream]
