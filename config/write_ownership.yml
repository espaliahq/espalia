  owner: plain
  reason: Destroying a key is how a plan's figures are shredded, and events can't be deleted.
  writers:
    - app/models/plan_key_store.rb

# People and accounts

people:
  owner: org_graph/people_columns
  columns:
    - job_title
    - manager_id
    - status
  reason: >-
    The row holds a person's identifiers, which must be erasable. The HiBob adapter writes the
    projection's columns only before a tenant is cut over. The seeds never cut the demo tenant over,
    so the calibration history seed moves reporting lines on the row, which manager-rating authority
    falls back to; it also records each move on the person's development stream (#572).
  writers:
    - app/contexts/org_graph/forgetting.rb
    - app/integrations/hris/hibob/adapter.rb
    - app/models/tenant_user.rb
    - lib/tasks/calibration_history_seed.rb
    - lib/tasks/evidence_suggestions_eval.rb
    - lib/tasks/example_seed.rb
    - lib/tasks/stress_seed.rb
  column_writers:
    - app/integrations/hris/hibob/adapter.rb
    - lib/tasks/calibration_history_seed.rb
tenant_users:
  owner: account_grants/account_flags
  columns:
    - org_graph_editor
    - person_id
    - role
    - team_planner
  reason: >-
    Links an account to a tenant, a person and a Slack user. Writers insert accounts with their first role, which the grants stream then
    records; a role and the link to a person change only through that stream.
  writers:
    - app/contexts/org_graph/forgetting.rb
    - app/integrations/hris/hibob/adapter.rb
    - app/integrations/slack/identity.rb
    - app/models/person.rb
    - app/models/tenant.rb
    - app/models/tenant_user.rb
    - app/models/user.rb
    - app/notifiers/slack_delivery_method.rb
    - lib/tasks/example_seed.rb
    - lib/tasks/stress_seed.rb
users:
  owner: plain
  reason: Devise's sign-in identity, shared across tenants.
  writers:
    - app/controllers/settings/color_schemes_controller.rb
    - app/models/person.rb
    - app/models/user.rb
    - app/notifiers/slack_delivery_method.rb
    - lib/seed_admin.rb
    - lib/tasks/admin.rake
    - lib/tasks/example_seed.rb
    - lib/tasks/stress_seed.rb
tenants:
  owner: tenant_planning_inputs/tables
  columns:
    - pay_bands_changed_at
  reason: >-
    The tenant's configuration and operational stamps. The pay band stamp is written from the
    TenantPlanningInputs stream. Retention and scheduled forgetting are also written here, beside
    tenant_retention_settings, until Track C of https://github.com/espaliahq/espalia/issues/539 drops the old keys.
  writers:
    - app/contexts/org_graph/people_cutover.rb
    - app/contexts/org_graph/person_development_cutover.rb
    - app/contexts/tenant_settings/command_handler.rb
    - app/integrations/hris/hibob/adapter.rb
    - app/models/tenant.rb
    - app/operations/operations/integrations/hris_title_preview.rb
    - app/operations/operations/org_graph/update_staleness_threshold.rb
    - app/operations/operations/tenants/set_time_zone.rb
    - app/operations/operations/tenants/update_comparisons.rb
    - app/operations/operations/tenants/update_scoring_vocabulary.rb
    - app/operations/operations/tenants/update_theme.rb
    - lib/tasks/evidence_suggestions_eval.rb
    - lib/tasks/example_seed.rb
    - lib/tasks/stress_seed.rb
tenant_retention_settings:
  owner: tenant_settings/retention

# Sign-in and API access

oauth_access_grants:
  owner: plain
  reason: Doorkeeper's grants; their history is login telemetry, not a domain decision.
  writers:
    - app/controllers/oauth/authorizations_controller.rb
    - app/jobs/mcp/prune_stale_clients_job.rb
oauth_access_tokens:
  owner: plain
  reason: Doorkeeper's tokens; their history is login telemetry, not a domain decision.
  writers:
    - app/controllers/settings/connected_clients_controller.rb
    - app/jobs/mcp/prune_stale_clients_job.rb
oauth_applications:
  owner: plain
  reason: MCP clients registered through Doorkeeper.
  writers:
    - app/controllers/mcp/client_registrations_controller.rb
    - app/jobs/mcp/prune_stale_clients_job.rb
mcp_pending_approvals:
  owner: plain
  reason: An MCP call waiting for approval. The call it approves runs through an Operation, whose events carry it.
  writers:
    - app/controllers/mcp/approvals_controller.rb
    - app/services/mcp/request_handler.rb

# Pay and cost inputs

pay_bands:
