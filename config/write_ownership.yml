# Who may write each table. test/db/write_ownership_test.rb holds every table to
# an entry, and CI's write_ownership:check holds every recorded write to it.
# How to write an entry: docs/architecture/direct-writes.md#declaring-a-table-or-a-writer

# Assessment cycles

assessment_cycle_enrollments:
  owner: assessment_cycles/current_state
assessment_cycles:
  owner: assessment_cycles/current_state
calibration_session_members:
  owner: assessment_cycles/calibration_sessions
calibration_sessions:
  owner: assessment_cycles/calibration_sessions

# Person development

assessment_cycle_progress:
  owner: person_development/current_assessment
assessment_cycle_role_alignments:
  owner: person_development/current_assessment
assessment_explorations:
  owner: person_development/current_assessment
assessment_level_ratings:
  owner: person_development/current_assessment
person_framework_assignments:
  owner: person_development/current_assessment
  reason: The evidence evaluation builds a throwaway tenant and rolls it back.
  writers:
    - lib/tasks/evidence_suggestions_eval.rb
evidence_items:
  owner: person_development/evidence_collection
  reason: The evidence evaluation builds a throwaway tenant and rolls it back.
  writers:
    - lib/tasks/evidence_suggestions_eval.rb
evidence_links:
  owner: person_development/evidence_collection
evidence_placement_suggestions:
  owner: person_development/evidence_suggestions
  reason: >-
    The projection's own pre-deploy reconcile closes the pending rows of people forgotten before it
    handled PersonForgotten (https://github.com/espaliahq/espalia/issues/590).
  writers:
    - app/contexts/person_development/projections/evidence_suggestions.rb
evidence_requests:
  owner: person_development/evidence_requests
person_development_comments:
  owner: person_development/comment_thread
manager_assessment_delegations:
  owner: person_development/assessment_authority
recorded_reporting_managers:
  owner: person_development/assessment_authority

