framework_capability_role_bindings:
  owner: frameworks/published_state
  reason: The evidence evaluation builds a throwaway tenant and rolls it back.
  writers:
    - lib/tasks/evidence_suggestions_eval.rb
framework_collaborators:
  owner: frameworks/published_state
framework_explorer_graphs:
  owner: plain
  reason: >-
    ExplorerGraph caches the snapshot it builds from the stream. No projection resets it, and a
    missing or stale row is rebuilt on the next load.
  writers:
    - app/contexts/frameworks/explorer_graph.rb
framework_levels:
  owner: frameworks/published_state
  reason: The evidence evaluation builds a throwaway tenant and rolls it back.
  writers:
    - lib/tasks/evidence_suggestions_eval.rb
framework_migration_mappings:
  owner: frameworks/published_state
framework_role_families:
  owner: frameworks/published_state
  reason: The evidence evaluation builds a throwaway tenant and rolls it back.
  writers:
    - lib/tasks/evidence_suggestions_eval.rb
framework_role_illustrations:
  owner: frameworks/published_state
  reason: The evidence evaluation builds a throwaway tenant and rolls it back.
  writers:
    - lib/tasks/evidence_suggestions_eval.rb
framework_roles:
  owner: frameworks/published_state
  reason: The evidence evaluation builds a throwaway tenant and rolls it back.
  writers:
    - lib/tasks/evidence_suggestions_eval.rb
framework_states:
  owner: frameworks/published_state
  reason: The evidence evaluation builds a throwaway tenant and rolls it back.
  writers:
    - lib/tasks/evidence_suggestions_eval.rb
framework_suggested_edits:
  owner: frameworks/published_state
framework_suggestion_comments:
  owner: frameworks/suggestion_thread
framework_publications:
  owner: plain
  reason: Tracks a background publish job. The publish itself is FrameworkVersionPublished.
  writers:
    - app/jobs/frameworks/publish_version_job.rb
    - app/models/framework_publication.rb
    - app/operations/operations/frameworks/publish_version.rb

# Org Graph

org_fact_ages:
  owner: org_graph/fact_ages
org_fact_periods:
  owner: org_graph/history
org_fact_providers:
  owner: org_graph/structure
org_leavers:
  owner: org_graph/leavers
org_memberships:
  owner: org_graph/members
org_taxonomy_levels:
  owner: org_graph/structure
org_unit_activities:
  owner: org_graph/unit_activity
org_unit_owners:
  owner: org_graph/structure
org_unit_successions:
  owner: org_graph/structure
org_units:
  owner: org_graph/structure

# Team Planning

team_planning_history_entries:
  owner: team_planning/history
team_planning_removed_scenario_tallies:
  owner: team_planning/history
team_planning_overrides:
  owner: team_planning/overrides
team_planning_plan_members:
  owner: team_planning/plan_members
team_planning_plans:
  owner: team_planning/plans
team_planning_removed_scenarios:
  owner: team_planning/scenarios
team_planning_scenarios:
  owner: team_planning/scenarios
plan_encryption_keys:
  owner: plain
  reason: Destroying a key is how a plan's figures are shredded, and events can't be deleted.
  writers:
    - app/models/plan_key_store.rb

# People and accounts

people:
  owner: org_graph/people_columns
  columns:
    - job_title
    - manager_id
    - status
  reason: >-
    The row holds a person's identifiers, which must be erasable. The HiBob adapter writes the
    projection's columns only before a tenant is cut over. The seeds write rows before they cut a
    tenant over, and change the columns with Org Graph commands after it.
  writers:
    - app/contexts/org_graph/forgetting.rb
    - app/integrations/hris/hibob/adapter.rb
    - app/models/tenant_user.rb
    - lib/tasks/evidence_suggestions_eval.rb
    - lib/tasks/example_seed.rb
    - lib/tasks/stress_seed.rb
  column_writers:
    - app/integrations/hris/hibob/adapter.rb
tenant_users:
  owner: account_grants/account_flags
  columns:
    - org_graph_editor
    - person_id
    - role
    - team_planner
  reason: >-
    Links an account to a tenant, a person and a Slack user. Writers insert accounts with their first role, which the grants stream then
    records; a role and the link to a person change only through that stream.
  writers:
    - app/contexts/org_graph/forgetting.rb
    - app/integrations/hris/hibob/adapter.rb
    - app/integrations/slack/identity.rb
    - app/models/person.rb
    - app/models/tenant.rb
    - app/models/tenant_user.rb
    - app/models/user.rb
    - app/notifiers/slack_delivery_method.rb
    - lib/tasks/example_seed.rb
    - lib/tasks/stress_seed.rb
global_admin_changes:
  owner: plain
  reason: >-
    The audit of users.global_admin, which stays plain state as it is global and no tenant stream fits
    (https://github.com/espaliahq/espalia/issues/539). User records a row in the save that changes the flag.
  writers:
    - app/models/user.rb
users:
  owner: plain
  reason: Devise's sign-in identity, shared across tenants.
  writers:
    - app/controllers/settings/color_schemes_controller.rb
    - app/models/person.rb
    - app/models/user.rb
    - app/notifiers/slack_delivery_method.rb
    - lib/seed_admin.rb
    - lib/tasks/admin.rake
    - lib/tasks/example_seed.rb
    - lib/tasks/stress_seed.rb
tenant_setting_changes:
  owner: plain
  reason: >-
    Each change to the settings past answers read: the time zone and the smallest comparison group
    (https://github.com/espaliahq/espalia/issues/553). Tenant records a row in the save that changes one.
  writers:
    - app/models/tenant.rb
tenants:
  owner: tenant_planning_inputs/tables
  columns:
    - pay_bands_changed_at
  reason: >-
    The tenant's configuration and operational stamps. The pay band stamp is written from the
    TenantPlanningInputs stream. The tenant settings commands remove the retention keys the stream
    replaced, which the previous release writes back while a deploy is in flight.
  writers:
    - app/contexts/org_graph/people_cutover.rb
    - app/contexts/org_graph/person_development_cutover.rb
    - app/contexts/tenant_settings/command_handler.rb
    - app/integrations/hris/hibob/adapter.rb
    - app/models/tenant.rb
    - app/operations/operations/integrations/hris_title_preview.rb
    - app/operations/operations/org_graph/update_staleness_threshold.rb
    - app/operations/operations/tenants/set_time_zone.rb
    - app/operations/operations/tenants/update_comparisons.rb
    - app/operations/operations/tenants/update_scoring_vocabulary.rb
    - app/operations/operations/tenants/update_theme.rb
    - lib/tasks/evidence_suggestions_eval.rb
    - lib/tasks/example_seed.rb
    - lib/tasks/stress_seed.rb
tenant_retention_settings:
  owner: tenant_settings/retention

# Sign-in and API access

oauth_access_grants:
  owner: plain
  reason: Doorkeeper's grants; their history is login telemetry, not a domain decision.
  writers:
    - app/controllers/oauth/authorizations_controller.rb
    - app/jobs/mcp/prune_stale_clients_job.rb
oauth_access_tokens:
  owner: plain
  reason: Doorkeeper's tokens; their history is login telemetry, not a domain decision.
  writers:
    - app/controllers/settings/connected_clients_controller.rb
    - app/jobs/mcp/prune_stale_clients_job.rb
oauth_applications:
  owner: plain
  reason: MCP clients registered through Doorkeeper.
  writers:
    - app/controllers/mcp/client_registrations_controller.rb
    - app/jobs/mcp/prune_stale_clients_job.rb
mcp_pending_approvals:
  owner: plain
  reason: An MCP call waiting for approval. The call it approves runs through an Operation, whose events carry it.
  writers:
    - app/controllers/mcp/approvals_controller.rb
    - app/services/mcp/request_handler.rb

# Pay and cost inputs

pay_bands:
  owner: tenant_planning_inputs/tables
  reason: Pay and cost inputs, written from the TenantPlanningInputs stream.
exchange_rates:
  owner: tenant_planning_inputs/tables
  reason: Pay and cost inputs, written from the TenantPlanningInputs stream.
reference_currencies:
  owner: tenant_planning_inputs/tables
  reason: Pay and cost inputs, written from the TenantPlanningInputs stream.
budget_lines:
  owner: tenant_planning_inputs/tables
  reason: Pay and cost inputs, written from the TenantPlanningInputs stream.
planning_rule_defaults:
  owner: tenant_planning_inputs/tables
  reason: Pay and cost inputs, written from the TenantPlanningInputs stream.

# Working data

hris_sync_issues:
  owner: plain
  reason: Each sync rebuilds them from what the HRIS reports; a to-do list, not a record.
  writers:
    - app/integrations/hris/level_handover.rb
    - app/models/hris_sync_issue.rb
hris_unit_parent_proposals:
  owner: plain
  reason: Each sync rebuilds them from what the HRIS reports; a to-do list, not a record.
  writers:
    - app/integrations/hris/level_mirror.rb
feedback_drafts:
  owner: plain
  reason: A draft lives until the Slack modal submits it.
  writers:
    - app/integrations/slack/feedback.rb
    - app/models/feedback_draft.rb
feedback_exchange_acks:
  owner: plain
  reason: A ledger of what the feedback exchange sent, used to skip duplicates.
  writers:
    - app/models/feedback_exchange_ack.rb
feedback_exchange_imports:
  owner: plain
  reason: A ledger of what the feedback exchange received, used to skip duplicates.
  writers:
    - app/contexts/org_graph/forgetting.rb
    - app/integrations/feedback_exchange/importer.rb
level_comparison_groups:
  owner: plain
  reason: Derived from ratings when a snapshot is taken, so it can be taken again.
  writers:
    - app/models/level_comparison_snapshot.rb
level_comparison_snapshots:
  owner: plain
  reason: Derived from ratings when a snapshot is taken, so it can be taken again.
  writers:
    - app/models/level_comparison_snapshot.rb
noticed_events:
  owner: plain
  reason: The Noticed gem's delivery queue.
  writers:
    - app/contexts/org_graph/forgetting.rb
    - app/notifiers/application_notifier.rb
noticed_notifications:
  owner: plain
  reason: The Noticed gem's delivery queue and read state.
  writers:
    - app/contexts/org_graph/forgetting.rb
    - app/controllers/notifications_controller.rb
    - app/models/evidence/conversation_reads.rb
    - app/notifiers/application_notifier.rb

# Infrastructure

event_store_events:
  owner: event_store
  reason: >-
    Sealing the names held in clear in plan events is the one sanctioned
    rewrite of stored events. Nothing else may rewrite an event.
  writers:
    - app/contexts/team_planning/name_sealing.rb
event_store_events_in_streams:
  owner: event_store
projection_versions:
  owner: plain
  reason: Deploy bookkeeping, recording the code version each projection was last rebuilt at.
  writers:
    - app/models/projection_version.rb
