planning_rule_defaults:
  owner: tenant_planning_inputs/tables
  reason: Pay and cost inputs, written from the TenantPlanningInputs stream.

# Working data

hris_sync_issues:
  owner: plain
  reason: Each sync rebuilds them from what the HRIS reports; a to-do list, not a record.
  writers:
    - app/integrations/hris/level_handover.rb
    - app/models/hris_sync_issue.rb
hris_unit_parent_proposals:
  owner: plain
  reason: Each sync rebuilds them from what the HRIS reports; a to-do list, not a record.
  writers:
    - app/integrations/hris/level_mirror.rb
evidence_placement_suggestions:
  owner: plain
  reason: AI output until someone accepts one, and accepting writes evidence through events.
  writers:
    - app/controllers/concerns/evidence_diff_submit.rb
    - app/jobs/evidence/suggest_placements_job.rb
    - app/models/evidence_placement_suggestion.rb
feedback_drafts:
  owner: plain
  reason: A draft lives until the Slack modal submits it.
  writers:
    - app/integrations/slack/feedback.rb
    - app/models/feedback_draft.rb
feedback_exchange_acks:
  owner: plain
  reason: A ledger of what the feedback exchange sent, used to skip duplicates.
  writers:
    - app/models/feedback_exchange_ack.rb
feedback_exchange_imports:
  owner: plain
  reason: A ledger of what the feedback exchange received, used to skip duplicates.
  writers:
    - app/contexts/org_graph/forgetting.rb
    - app/integrations/feedback_exchange/importer.rb
level_comparison_groups:
  owner: plain
  reason: Derived from ratings when a snapshot is taken, so it can be taken again.
  writers:
    - app/models/level_comparison_snapshot.rb
level_comparison_snapshots:
  owner: plain
  reason: Derived from ratings when a snapshot is taken, so it can be taken again.
  writers:
    - app/models/level_comparison_snapshot.rb
noticed_events:
  owner: plain
  reason: The Noticed gem's delivery queue.
  writers:
    - app/contexts/org_graph/forgetting.rb
    - app/notifiers/application_notifier.rb
noticed_notifications:
  owner: plain
  reason: The Noticed gem's delivery queue and read state.
  writers:
    - app/contexts/org_graph/forgetting.rb
    - app/controllers/notifications_controller.rb
    - app/models/evidence/conversation_reads.rb
    - app/notifiers/application_notifier.rb

# Infrastructure

event_store_events:
