org_taxonomy_levels:
  owner: org_graph/structure
org_unit_activities:
  owner: org_graph/unit_activity
org_unit_owners:
  owner: org_graph/structure
org_unit_successions:
  owner: org_graph/structure
org_units:
  owner: org_graph/structure

# Team Planning

team_planning_history_entries:
  owner: team_planning/history
team_planning_removed_scenario_tallies:
  owner: team_planning/history
team_planning_overrides:
  owner: team_planning/overrides
team_planning_plan_members:
  owner: team_planning/plan_members
team_planning_plans:
  owner: team_planning/plans
team_planning_removed_scenarios:
  owner: team_planning/scenarios
team_planning_scenarios:
  owner: team_planning/scenarios
