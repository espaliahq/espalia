name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # Fired by dependabot-auto-merge after its GITHUB_TOKEN merge, which GitHub's
  # recursion guard stops from triggering the push run above.
  workflow_dispatch:

# Every job here is read-only (no git push/commit, no releases). Grant the
# workflow token least privilege rather than the repo default.
permissions:
  contents: read

jobs:
  scan_ruby:
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # The series, not .ruby-version's exact patch: GitHub-hosted images
          # only carry each series' latest patch build. Gemfile allows the range.
          ruby-version: "4.0"
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # The series, not .ruby-version's exact patch: GitHub-hosted images
          # only carry each series' latest patch build. Gemfile allows the range.
          ruby-version: "4.0"
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # The series, not .ruby-version's exact patch: GitHub-hosted images
          # only carry each series' latest patch build. Gemfile allows the range.
          ruby-version: "4.0"
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # Boots the app with the PRODUCTION gem set (no development/test gems) and
  # eager-loads every autoload path. Catches the class of bug from the #106/
  # #108 incident: a file under lib/ (or an initializer/model) that references
  # a constant only defined by a development/test-only gem — invisible to the
  # test suite (where those gems ARE loaded), but crashes Render at boot.
  # Eager-loading is DB-free, so no postgres service is needed.
  production_boot:
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}
    env:
      BUNDLE_WITHOUT: "development:test"
      RAILS_ENV: production
      SECRET_KEY_BASE: dummy-secret-key-base-for-eager-load-only
      DISABLE_DATABASE_ENVIRONMENT_CHECK: "1"
      # Boot purely to verify autoloading — CI has no decrypted credentials,
      # so relax production's runtime-secret fail-fasts (e.g. Google OAuth).
      EAGER_LOAD_CHECK: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby (production gem set only)
        uses: ruby/setup-ruby@v1
        with:
          # The series, not .ruby-version's exact patch: GitHub-hosted images
          # only carry each series' latest patch build. Gemfile allows the range.
          ruby-version: "4.0"
          bundler-cache: true

      - name: Eager-load the app as production would
        run: bin/rails zeitwerk:check

  # test_helper runs one worker per processor, so more vCPUs is a straight speed-up.
  test:
    runs-on: ${{ vars.CI_RUNNER_LARGE || 'ubuntu-latest' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # The series, not .ruby-version's exact patch: GitHub-hosted images
          # only carry each series' latest patch build. Gemfile allows the range.
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DB_HOST: localhost
          # The claude CLI parity test (test/integration/mcp_claude_cli_test.rb)
          # is slow (real LLM round-trip) and needs Node + the CLI + an OAuth
          # token. To avoid those install costs and to keep this job fast,
          # we skip it here and run it in the dedicated `mcp-cli-test` job.
          SKIP_MCP_CLI_TEST: "1"
        run: bin/rails db:test:prepare test

  # Runs only the claude CLI parity test (test/integration/mcp_claude_cli_test.rb)
  # in isolation. Pulled out of the main `test` job because:
  #   1. It needs Node + @anthropic-ai/claude-code installed (~30-60s).
  #   2. It needs the CLAUDE_CODE_OAUTH_TOKEN secret (Actions scope only —
  #      Dependabot PRs skip this job by design; see the token step below).
  #   3. The real LLM round-trip dominates the main test job's wall time.
  # Running it as its own job lets the main `test` job finish faster and
  # makes "is CI red because of code, or because of Claude?" obvious.
  mcp-cli-test:
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # A fork PR has no CLAUDE_CODE_OAUTH_TOKEN, so the real LLM round-trip
      # cannot run: the job skips its steps and passes instead of failing
      # every outside contribution. A Dependabot PR skips by author, not by
      # token absence: the test step would hand the token to the freshly
      # bumped dependency's own code, a supply-chain exfiltration channel,
      # so no Dependabot secret exists and none should be added — the bump
      # gets its parity run on main via the workflow_dispatch that
      # dependabot-auto-merge fires after merging (its own GITHUB_TOKEN
      # merge cannot trigger the push run). On any other same-repo run an
      # empty secret is a
      # configuration loss, not a fork — fail loudly, or parity coverage
      # disappears silently. Job-level `if:` cannot read secrets, hence
      # this step.
      - name: Check the Claude OAuth token is available
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          if [ "$IS_DEPENDABOT_PR" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependabot PR — the CLI parity test runs on main after the merge, so the token is never exposed to just-bumped dependency code."
          elif [ "$HAS_TOKEN" != "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "$IS_FORK_PR" = "true" ]; then
              echo "::notice::Fork PR without CLAUDE_CODE_OAUTH_TOKEN — skipping the CLI parity test; it runs on the upstream repository."
            else
              echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty on a same-repo run. Restore it (generate with 'claude setup-token', set as an Actions secret — never a Dependabot secret), or remove this job if this instance deliberately runs without parity coverage."
              exit 1
            fi
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7

      - name: Set up Ruby
        if: steps.token.outputs.present == 'true'
        uses: ruby/setup-ruby@v1
        with:
          # The series, not .ruby-version's exact patch: GitHub-hosted images
          # only carry each series' latest patch build. Gemfile allows the range.
          ruby-version: "4.0"
          bundler-cache: true

      - name: Set up Node + install claude CLI
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - if: steps.token.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run claude CLI parity test
        if: steps.token.outputs.present == 'true'
        env:
          RAILS_ENV: test
          DB_HOST: localhost
          # The test skips when the claude binary is absent; in this job a
          # missing binary means the install step above broke, so stay loud.
          REQUIRE_MCP_CLI: "1"
          # Generate locally with `claude setup-token` and add the output
          # as a repo Actions secret named CLAUDE_CODE_OAUTH_TOKEN. Never
          # add a Dependabot secret: Dependabot PRs skip this job by design.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # Run db:test:prepare and test as two separate invocations.
        # `bin/rails db:test:prepare test <path>` parses <path> as a third
        # Rails command, not as an argument to `test`, and fails with
        # `Rails::Command::UnrecognizedCommandError`.
        run: |
          bin/rails db:test:prepare
          bin/rails test test/integration/mcp_claude_cli_test.rb

  # Ten workers on 32 vCPUs leaves each Chrome about three cores: a starved
  # Chrome drops clicks. Matched 12 sharded jobs for speed (.github/AGENTS.md).
  # CI_SYSTEM_TEST_WORKERS and CI_RUNNER_XLARGE are separate variables — size
  # them together (~3 vCPUs per Chrome). Without them (a fork) the job runs
  # one worker on the GitHub-hosted fallback: slow, but no starved Chromes.
  system-test:
    runs-on: ${{ vars.CI_RUNNER_XLARGE || 'ubuntu-latest' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # The series, not .ruby-version's exact patch: GitHub-hosted images
          # only carry each series' latest patch build. Gemfile allows the range.
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DB_HOST: localhost
          SYSTEM_TEST_WORKERS: ${{ vars.CI_SYSTEM_TEST_WORKERS || '1' }}
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # The feedback exchange's Pact contract with Chip (docs/guidelines/feedback-exchange.md
  # → Contract tests). Our consumer pact must be what the consumer tests write; then
  # our branch is verified as provider against the pact Chip has deployed. Chip's
  # /contract URL is the FEEDBACK_EXCHANGE_PEER_CONTRACT_URL repository variable;
  # while it is unset, or Chip has never published, that step passes with a warning.
  contract:
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      RAILS_ENV: test
      DB_HOST: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # The series, not .ruby-version's exact patch: GitHub-hosted images
          # only carry each series' latest patch build. Gemfile allows the range.
          ruby-version: "4.0"
          bundler-cache: true

      - name: Prepare the database
        run: bin/rails db:test:prepare

      - name: Consumer contract tests (Espalia as Chip's consumer)
        run: bin/rails contract:consumer

      - name: Committed pact is what the tests wrote
        run: |
          if ! git diff --exit-code -- contract/pacts; then
            echo "::error::contract/pacts/growthos-chip.json is not what the consumer contract tests write. Run bin/rails contract:consumer and commit the result."
            exit 1
          fi

      - name: Today's date, for the contract cache
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Chip's contract
        uses: actions/cache@v6
        with:
          path: tmp/contract
          key: feedback-exchange-peer-contract-${{ steps.date.outputs.date }}
          restore-keys: feedback-exchange-peer-contract-

      - name: Provider verification against Chip's deployed pact
        env:
          FEEDBACK_EXCHANGE_PEER_CONTRACT_URL: ${{ vars.FEEDBACK_EXCHANGE_PEER_CONTRACT_URL }}
        run: bin/rails contract:provider

  gitleaks:
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan all git history for secrets
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL --retry 8 --retry-delay 30 --retry-all-errors "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --no-banner --redact .

  # Merges Dependabot's PRs once every job above has passed on the same head.
  # Every guard reads the PR, never github.actor: the actor can be made
  # dependabot[bot] on someone else's PR ("Dependabot confusion"). Fork PRs get a
  # read-only token whatever this job asks for. See .github/AGENTS.md before editing.
  dependabot-auto-merge:
    needs: [scan_ruby, scan_js, lint, production_boot, test, mcp-cli-test, system-test, contract, gitleaks]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}
    concurrency:
      group: dependabot-auto-merge-${{ github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check every commit is Dependabot's own
        id: commits
        run: |
          # The commits endpoint stops at 250, so a longer PR would go partly unchecked.
          total=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .commits)
          if [ "$total" -gt 250 ]; then
            echo "::notice::Leaving PR #$PR_NUMBER for a human: its $total commits are more than GitHub will list."
            exit 0
          fi
          others=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | select(.author.login != "dependabot[bot]" or .commit.verification.verified != true) | .sha')
          if [ -n "$others" ]; then
            echo "::notice::Leaving PR #$PR_NUMBER for a human: it carries commits not signed by Dependabot ($others)."
            exit 0
          fi
          echo "trusted=true" >> "$GITHUB_OUTPUT"

      - name: Approve the commit that was checked
        if: steps.commits.outputs.trusted == 'true'
        run: |
          # A push after the commit check would otherwise collect this approval.
          head=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$PR_NUMBER moved on to $head before approval; its own CI run will handle it."
            exit 0
          fi
          gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" -f event=APPROVE -f commit_id="$HEAD_SHA"

      - name: Merge the head CI tested
        id: merge
        if: steps.commits.outputs.trusted == 'true'
        run: |
          # Retry to absorb the brief mergeability recompute after approval.
          for attempt in 1 2 3 4 5; do
            if ! pr=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,headRefOid --jq '"\(.state) \(.headRefOid)"'); then
              echo "Could not read PR #$PR_NUMBER (attempt $attempt); sleeping 10s…"
              sleep 10
              continue
            fi
            read -r state head <<< "$pr"
            if [ "$state" != "OPEN" ]; then
              echo "::notice::PR #$PR_NUMBER is $state; nothing to merge."
              # A merge that lands but exits non-zero (say --delete-branch
              # failed) reaches here as MERGED: still owed its parity run.
              [ "$state" = "MERGED" ] && echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$head" != "$HEAD_SHA" ]; then
              echo "::notice::PR #$PR_NUMBER moved on to $head; its own CI run will merge it."
              exit 0
            fi
            if gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              echo "Merged on attempt $attempt"
              exit 0
            fi
            echo "Merge not ready (attempt $attempt); sleeping 10s…"
            sleep 10
          done
          # The loop re-reads state only at its top: a fifth attempt that lands
          # while exiting non-zero would otherwise lose its parity run.
          state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq .state || echo UNKNOWN)
          if [ "$state" = "MERGED" ]; then
            echo "::notice::PR #$PR_NUMBER merged on the final attempt despite a non-zero exit."
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::PR #$PR_NUMBER still not mergeable after retries (unresolved conversations, or a policy not yet met)."
          exit 1

      - name: Run the parity test on the merged main
        if: steps.merge.outputs.merged == 'true'
        run: |
          # The GITHUB_TOKEN merge above cannot trigger the push run on main
          # (GitHub's recursion guard), and that run is the only place the CLI
          # parity test meets a Dependabot bump. workflow_dispatch is exempt
          # from the guard, so fire the run the merge suppressed.
          gh workflow run ci.yml --repo "$REPO" --ref main
