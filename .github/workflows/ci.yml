name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Every job here is read-only (no git push/commit, no releases). Grant the
# workflow token least privilege rather than the repo default.
permissions:
  contents: read

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # Boots the app with the PRODUCTION gem set (no development/test gems) and
  # eager-loads every autoload path. Catches the class of bug from the #106/
  # #108 incident: a file under lib/ (or an initializer/model) that references
  # a constant only defined by a development/test-only gem — invisible to the
  # test suite (where those gems ARE loaded), but crashes Render at boot.
  # Eager-loading is DB-free, so no postgres service is needed.
  production_boot:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: "development:test"
      RAILS_ENV: production
      SECRET_KEY_BASE: dummy-secret-key-base-for-eager-load-only
      DISABLE_DATABASE_ENVIRONMENT_CHECK: "1"
      # Boot purely to verify autoloading — CI has no decrypted credentials,
      # so relax production's runtime-secret fail-fasts (e.g. Google OAuth).
      EAGER_LOAD_CHECK: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby (production gem set only)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Eager-load the app as production would
        run: bin/rails zeitwerk:check

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DB_HOST: localhost
          # The claude CLI parity test (test/integration/mcp_claude_cli_test.rb)
          # is slow (real LLM round-trip) and needs Node + the CLI + an OAuth
          # token. To avoid those install costs and to keep this job fast,
          # we skip it here and run it in the dedicated `mcp-cli-test` job.
          SKIP_MCP_CLI_TEST: "1"
        run: bin/rails db:test:prepare test

  # Runs only the claude CLI parity test (test/integration/mcp_claude_cli_test.rb)
  # in isolation. Pulled out of the main `test` job because:
  #   1. It needs Node + @anthropic-ai/claude-code installed (~30-60s).
  #   2. It needs the CLAUDE_CODE_OAUTH_TOKEN secret (added under both
  #      Actions and Dependabot scopes so dependabot PRs work too).
  #   3. The real LLM round-trip dominates the main test job's wall time.
  # Running it as its own job lets the main `test` job finish faster and
  # makes "is CI red because of code, or because of Claude?" obvious.
  mcp-cli-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node + install claude CLI
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g @anthropic-ai/claude-code

      - name: Run claude CLI parity test
        env:
          RAILS_ENV: test
          DB_HOST: localhost
          # Generate locally with `claude setup-token` and add the output
          # as a repo Actions secret (and Dependabot secret) named
          # CLAUDE_CODE_OAUTH_TOKEN.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # Run db:test:prepare and test as two separate invocations.
        # `bin/rails db:test:prepare test <path>` parses <path> as a third
        # Rails command, not as an argument to `test`, and fails with
        # `Rails::Command::UnrecognizedCommandError`.
        run: |
          bin/rails db:test:prepare
          bin/rails test test/integration/mcp_claude_cli_test.rb

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DB_HOST: localhost
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Merges Dependabot's PRs once every job above has passed on the same head.
  # Every guard reads the PR, never github.actor: the actor can be made
  # dependabot[bot] on someone else's PR ("Dependabot confusion"). Fork PRs get a
  # read-only token whatever this job asks for. See AGENTS.md before editing.
  dependabot-auto-merge:
    needs: [scan_ruby, scan_js, lint, production_boot, test, mcp-cli-test, system-test]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-auto-merge-${{ github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check every commit is Dependabot's own
        id: commits
        run: |
          others=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | select(.author.login != "dependabot[bot]" or .commit.verification.verified != true) | .sha')
          if [ -n "$others" ]; then
            echo "::notice::Leaving PR #$PR_NUMBER for a human: it carries commits not signed by Dependabot ($others)."
            exit 0
          fi
          echo "trusted=true" >> "$GITHUB_OUTPUT"

      - name: Approve the commit that was checked
        if: steps.commits.outputs.trusted == 'true'
        run: |
          # A push after the commit check would otherwise collect this approval.
          head=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$PR_NUMBER moved on to $head before approval; its own CI run will handle it."
            exit 0
          fi
          gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" -f event=APPROVE -f commit_id="$HEAD_SHA"

      - name: Merge the head CI tested
        if: steps.commits.outputs.trusted == 'true'
        run: |
          # Retry to absorb the brief mergeability recompute after approval.
          for attempt in 1 2 3 4 5; do
            if ! pr=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,headRefOid --jq '"\(.state) \(.headRefOid)"'); then
              echo "Could not read PR #$PR_NUMBER (attempt $attempt); sleeping 10s…"
              sleep 10
              continue
            fi
            read -r state head <<< "$pr"
            if [ "$state" != "OPEN" ]; then
              echo "::notice::PR #$PR_NUMBER is $state; nothing to merge."
              exit 0
            fi
            if [ "$head" != "$HEAD_SHA" ]; then
              echo "::notice::PR #$PR_NUMBER moved on to $head; its own CI run will merge it."
              exit 0
            fi
            if gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"; then
              echo "Merged on attempt $attempt"
              exit 0
            fi
            echo "Merge not ready (attempt $attempt); sleeping 10s…"
            sleep 10
          done
          echo "::error::PR #$PR_NUMBER still not mergeable after retries (unresolved conversations, or a policy not yet met)."
          exit 1
