envVarGroups:
  - name: growthos-shared
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: PGSSLMODE
        value: require
      - key: RAILS_MASTER_KEY
        sync: false

services:
  - type: web
    name: growthos-web
    runtime: ruby
    plan: standard
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /up
    buildCommand: ./bin/render-build
    preDeployCommand: ./bin/render-predeploy
    startCommand: bundle exec bin/thrust bin/rails server
    envVars:
      - fromGroup: growthos-shared
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: growthos-postgres
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: growthos-postgres
          property: host
      - key: DB_USERNAME
        fromDatabase:
          name: growthos-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: growthos-postgres
          property: password

  - type: worker
    name: growthos-worker
    runtime: ruby
    plan: standard
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: ./bin/render-build
    startCommand: bundle exec bin/jobs
    envVars:
      - fromGroup: growthos-shared
      - key: JOB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: DB_HOST
        fromDatabase:
          name: growthos-postgres
          property: host
      - key: DB_USERNAME
        fromDatabase:
          name: growthos-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: growthos-postgres
          property: password

databases:
  - name: growthos-postgres
    databaseName: growth_os_production
    plan: basic-1gb
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
