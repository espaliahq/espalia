# Render identifies blueprint resources by NAME: renaming one here makes the
# next blueprint sync provision a fresh (empty) resource, not rename the old.
# An existing deployment keeps its current names in its own copy of this file.
# Render ignores `sync: false` inside an environment group, so the two
# prompted secrets (RAILS_MASTER_KEY, APP_HOST) are declared per service.
envVarGroups:
  - name: espalia-shared
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: PGSSLMODE
        value: require

services:
  - type: web
    name: espalia-web
    runtime: ruby
    plan: standard
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /up
    buildCommand: ./bin/render-build
    preDeployCommand: ./bin/render-predeploy
    startCommand: bundle exec bin/thrust bin/rails server
    envVars:
      - fromGroup: espalia-shared
      - key: RAILS_MASTER_KEY
        sync: false
      # The host every generated link uses (config/environments/production.rb).
      - key: APP_HOST
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: espalia-postgres
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: espalia-postgres
          property: host
      - key: DB_USERNAME
        fromDatabase:
          name: espalia-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: espalia-postgres
          property: password

  - type: worker
    name: espalia-worker
    runtime: ruby
    plan: standard
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: ./bin/render-build
    startCommand: bundle exec bin/jobs
    envVars:
      - fromGroup: espalia-shared
      - key: RAILS_MASTER_KEY
        sync: false
      # The worker builds the same links (Slack DMs, mailers).
      - key: APP_HOST
        sync: false
      - key: JOB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: DB_HOST
        fromDatabase:
          name: espalia-postgres
          property: host
      - key: DB_USERNAME
        fromDatabase:
          name: espalia-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: espalia-postgres
          property: password

databases:
  - name: espalia-postgres
    databaseName: growth_os_production
    plan: basic-1gb
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
