        illustrations:
        - description: Leads design planning for a product area or initiative. Coordinates
            works with stream and ensures dependencies are managed.
          role_code: PD
        - description: Ability to plan and drive initiatives cross-functionally and
            cross-streams (as needed).
          role_code: PM
      - level: 5
        description: Manages end-to-end delivery of complex initiatives. Aligns scope,
          sequencing, and dependencies across a team.
        illustrations:
        - description: Oversees design execution across multiple products, user roles,
            and system states. Anticipates risks and keeps momentum during delivery.
          role_code: PD
        - description: "'Complex' means initiaitves that face significant constraints,
            could be a combination of technical constraints, change constraints, and
            capabiliy constraints."
          role_code: PM
      - level: 6
        description: Shapes delivery practices across teams. Sets the highest standard
          for consistent, scalable planning and delivery rhythms.
        illustrations:
        - description: 'E6 (As a tech-lead for an initiative) and EM5: Successfully
            delivers initiatives that require coordination and alignment with other
            teams, departments and/or externals such as partners or customers'
          role_code: E
        - description: 'E6 (As a tech-lead for an initiative) and EM5: Successfully
            delivers initiatives that require coordination and alignment with other
            teams, departments and/or externals such as partners or customers'
          role_code: EM
        - description: Improves how design integrates with product and engineering.
            Establishes healthy planning rhythms and delivery standards.
          role_code: PD
        - description: This includes Transformative initiatives that re-define our
            core business model, creates a new industry category, or significantly
            shifts me&u's company direction.
          role_code: PM
      - level: 7
        description: Aligns planning practices with business goals. Anticipates constraints
          and helps the organisation deliver predictably.
        illustrations:
        - description: Influences roadmap planning and capacity across design teams.
            Advocates for realistic timelines and scoped ambition.
          role_code: PD
        - description: Drives quarterly porfolio-level planning by aligning Executive
            stakeholders around product strategy, commercial outcome and success measures.
          role_code: PM
      - level: 8
        description: Defines and owns delivery strategy and systems across the company.
          Builds resilience and adaptability into how we plan and execute.
        illustrations:
        - description: Overall accountability to drive biannually and quarterly product
            planning.
          role_code: PM
  - name: Stream Leadership
    description: Capabilities expected of anyone in a stream leadership role.
    capabilities:
    - name: Product Discovery & Insight-Led Validation
      description: Identifies real customer problems and business opportunities through
        structured discovery. Uses qualitative and quantitative methods to validate
        ideas early and reduce uncertainty.
      scope: stream_leadership
      expectations:
      - level: 1
        description: Participates in discovery activities led by others. Understands
          the importance of research and validation.
        illustrations:
        - description: Takes part in interviews, usability tests, or research synthesis.
            Captures observations, listens to customer needs, and asks clarifying
            questions.
          role_code: PD
      - level: 2
        description: Proactively asks questions about the problem space. Contributes
          to research, interviews, or early solution exploration.
        illustrations:
        - description: Shows curiosity about user pain points, context, and edge cases.
            Participates in identifying themes and suggesting hypotheses.
          role_code: PD
      - level: 3
        description: Independently runs simple discovery tasks (e.g. usability testing,
          feedback sessions) and interprets findings with support.
        illustrations:
        - description: Plans and facilitates basic research sessions. Synthesises
            insights to influence design direction and problem definition.
          role_code: PD
        - description: Ability to effectively lead dual-track discovery & delivery
            to drive the balance between discovery and execution.
          role_code: PM
      - level: 4
        description: Leads structured discovery to inform problem framing and solution
          direction. Validates assumptions using appropriate methods.
        illustrations:
        - description: Drives appropriate discovery work (customer interviews, usibility
            testing, surveys, ideation sessions) that identifies customer needs, uncovers
            root causes, and challenges assumptions. Integrates findings into flows,
            journeys, and scope.
          role_code: PD
        - description: Ability to utilise knowldge and experience to steer the appropriate
            level of discovery and validation that are required for each initiative.
          role_code: PM
      - level: 5
        description: Designs and runs multi method discovery programs. Shares insight
          across teams to inform prioritisation and reduce build risk.
        illustrations:
        - description: Plans generative and evaluative research across the product
            lifecycle. Selects appropriate methods (e.g. surveys, card sorting, user
            testing) to guide strategic bets.
          role_code: PD
        - description: Ability to efficiently and effectively drive product discovery
            for complex initiatives. (e.g. creating new revenue streams / lines of
            businesses)
          role_code: PM
      - level: 6
        description: Drives a discovery culture across streams. Ensures solution direction
          is consistently grounded in validated customer and business needs.
        illustrations:
        - description: Builds structures and rhythms for ongoing discovery (e.g. monthly
            insight reviews, embedded research). Encourages teams to validate and
            reframe as they learn.
          role_code: PD
        - description: Lead by example, deliver tangible capabilty uplift across the
            organisation around ongoing discovery best practices.
          role_code: PM
      - level: 7
        description: Shapes function wide approaches to discovery and research. Anticipates
          what we need to learn next to stay ahead.
        illustrations:
        - description: Partners across functions to embed discovery into how the org
            makes decisions. Champions customer insight as a core input to roadmap
            and prioritisation.
          role_code: PD
        - description: Standardises dual-track discovery processes across the portfolio,
            and ensures problem framing precedes solutioning on high-impact bets.
          role_code: PM
      - level: 8
        description: Defines organisational standards for customer insight and validation.
          Embeds discovery as a strategic capability across me&u.
        illustrations:
        - description: Sets organisational discovery standards and tool investments,
            makes discovery quality a gate for strategic funding, and ensures customer
            insight is a durable capability.
          role_code: PM
  - name: Finance Leadership
