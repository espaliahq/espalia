    capabilities:
    - name: Strategic & Critical Thinking
      description: Considers long term impact, balances competing priorities, and
        makes smart, intentional decisions that support our mission and the people
        we serve.
      scope: core
      expectations:
      - level: 1
        description: Asks questions to understand problems and follows structured
          guidance.
        illustrations:
        - role_code: AE1
          description: Seeks guidance from a data lead on model requirements to ensure
            alignment.
        - role_code: DE1
          description: Seeks guidance from a data lead on model requirements to ensure
            alignment.
        - role_code: E1
          description: Asks clarifying questions before implementation; e.g. seeks
            guidance from a tech lead on API requirements to ensure alignment.
        - description: Seeks to understand design briefs by asking clarifying questions
            and using established design patterns or frameworks. Follows guidance
            when exploring user problems or contributing to simple features.
          role_code: PD
        - description: Checks figures in reconciliations and investigates unusual
            variances before finalising e.g. why did our AR balances increase
          role_code: FC
        - description: Checks figures in reconciliations and investigates unusual
            variances before finalising e.g. why did our AR balances increase
          role_code: FCo
        - description: Uses existing templates to prepare forecast inputs; checks
            figures against historical data.
          role_code: CF
        - description: Executes tasks (e.g., invoice uploads, workflow approvals)
            exactly as per documented process.
          role_code: FO
      - level: 2
        description: Identifies trade-offs and makes sound choices with support.
        illustrations:
        - role_code: AE2
          description: Compares using a third-party dbt package vs modelling in-house
            and checks with a senior.
        - role_code: DE2
          description: Compares using a third-party python library vs building in-house
            and checks with a senior.
        - role_code: E2
          description: Identifies trade-offs with support; e.g. compares using a third-party
            library vs building in-house and checks with a senior.
        - description: Begins to evaluate design trade-offs (e.g. usability vs technical
            feasibility) and seeks support from senior designers or PMs. Makes scoped
            decisions within the context of UI patterns, screen flows, or customer
            journeys.
          role_code: PD
        - description: Develops feature-level strategy and vision for assigned product
            area. Aligns with broader product strategy.
          role_code: PM
        - description: Identifies obvious trends or anomalies in balance sheet accounts;
            seeks guidance on resolution e.g. spots expense coded twices and asks
            whether to reverse now or in next close
          role_code: FC
        - description: Identifies obvious trends or anomalies in balance sheet accounts;
