      - level: 3
        description: Owns delivery of scoped work and participates in planning for
          small initiatives. Supports alignment through proactive and clear communication.
      - level: 4
        description: Manages plans and drivers delivery across function-specific cycles
          (e.g., month-end, budget submissions). Brings clarity through artefacts
          and rituals (e.g. timetables, roadmaps, delivery plans).
      - level: 5
        description: Designs and manages end to end delivery or multi-team initiatives
          and coordinates dependencies. Aligns scope, sequencing, and dependencies
          across teams.
      - level: 6
        description: Shapes delivery practices across the team. Sets the highest standard
          for consistent, scalable planning and delivery rhythms.
      - level: 7
        description: Aligns planning practices with business goals. Anticipates constraints
