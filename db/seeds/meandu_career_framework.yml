        illustrations:
        - description: Suggests small updates to names, labels, or usage notes. Identifies
            areas where documentation can be clearer.
          role_code: PD
      - level: 3
        description: Contributes minor improvements to the design system and its documentation.
        illustrations:
        - description: Adds missing states, variants, or tokens with support. Suggests
            refinements to usage guidelines. Begins collaborating with engineers to
            ensure feasibility.
          role_code: PD
      - level: 4
        description: Designs new components or patterns that are reusable, accessible,
          and align with system principles.
        illustrations:
        - description: Documents clear rationale and usage guidance. Considers responsive
            behaviour, scaling, and accessibility needs. Partners with engineers for
            smooth implementation.
          role_code: PD
      - level: 5
        description: Designs and documents scalable system patterns for common use
          cases. Helps resolve inconsistencies and reduce duplication across products
          or teams.
        illustrations:
        - description: Coaches peers on applying system patterns correctly. Advocates
            for inclusivity and accessibility as core parts of component design.
          role_code: PD
      - level: 6
        description: Shapes system conventions across platforms and product areas.
          Supports implementation and adoption across teams.
        illustrations:
        - description: Works closely with engineers on tokens, spacing, interactivity,
            and responsiveness. Ensures the system scales effectively across web and
            mobile.
          role_code: PD
      - level: 7
        description: Guides the evolution of the design system with product and engineering
          partners. Ensures adoption, governance, and maintainability across teams.
        illustrations:
        - description: Sets direction for how the system grows while maintaining clarity,
            accessibility, and consistency.
          role_code: PD
      - level: 8
        description: Defines the strategic role of design systems at me&u. Embeds
          usage across multiple streams or domains as a foundational enabler of speed,
          quality, and brand consistency.
    - name: Technical Fluency
      description: Understands technical constraints and system architecture well
        enough to shape viable product direction and collaborate effectively with
        other stream members.
      scope: Product Manager
      sheet: Product Management
      expectations:
      - level: 1
        description: Follows conversations about feasibility with support. Asks questions
          to learn about the tech stack.
      - level: 2
        description: Understands basic technical terminology and constraints. Collaborates
          with engineers to shape feasible solutions.
        illustrations:
        - description: Ability to understand high-level technical discussions within
            the team.
          role_code: PM
      - level: 3
        description: Frames product problems in a technically-informed way. Understands
          trade-offs and engages in scope conversations.
        illustrations:
        - description: Ability to participate in high-level technical discussions
            with the team.
          role_code: PM
      - level: 4
        description: Anticipates implications of product decisions on architecture
          and dependencies. Brings engineers into discovery early.
        illustrations:
        - description: Understanding of the high-level system architecture of a Product
            area (e.g. a particular stream).
          role_code: PM
      - level: 5
        description: Leads planning and decision-making for complex product initiatives
          that span systems. Translates tech context to non-technical stakeholders.
        illustrations:
        - description: "(e.g. initiatives that face significant technical constraints,
            and often require more than 1 month of development)"
          role_code: PM
        - description: Understanding of the end-to-end high-level system architecture
            across an entire product (e.g. Serve, Crew, Connect, flex, etc.)
          role_code: PM
      - level: 6
        description: Acts as a bridge between product and engineering strategy. Shapes
          roadmap direction based on technical leverage points.
        illustrations:
        - description: Understanding of the me&u system architecture and ecosystem.
            Ability to influence the technology strategy and roadmap.
          role_code: PM
      - level: 7
        description: Work closely with Engineering leaders to ensure our technology
          architecture, data structure and choices enable long term strategic vision
          and business outcome.
      - level: 8
        description: Co-creates technical strategy with the CTO, drives platform simplification
          and build-buy-partner choices, and invests in foundations that expand the
          product frontier.
    - name: Product Marketing
      description: Understands the role of product marketing and collaborates to position,
        message, and support the successful launch, adoption, and communication of
        product features. Tailors approach to audience needs and company context.
      scope: Product Manager
      sheet: Product Management
      expectations:
      - level: 1
        description: Is aware of who our customers are and how our product creates
          value. Learns how positioning and messaging are crafted.
      - level: 2
        description: Collaborates with others to support launch communications. Can
          describe the value of their team’s work in clear, simple terms.
        illustrations:
        - description: Understands how to execute product launch & go-to-market activities.
          role_code: PM
      - level: 3
        description: Works with other teams (e.g Marketing and GTM teams) to shape
          messaging and positioning. Shares customer and product context to support
          go-to-market efforts.
        illustrations:
        - description: Ability to support and manage product launch & go-to-market
            initaitives.
          role_code: PM
      - level: 4
        description: Anticipates messaging and adoption needs during planning and
          development. Helps shape value propositions and success criteria in collaboration
          with others.
        illustrations:
        - description: Ability to create the go-to-market strategy for product launch,
            and provide oversight throughout execution.
          role_code: PM
      - level: 5
        description: Partners across teams to lead launch, rollout, and communication
          plans. Adjusts feature scope or story based on feedback from the market.
        illustrations:
        - description: Ability to influence cross-functional stakeholders on the most
            desirable and compelling go-to-market strategy that will unlock tangible
            value through product innovation.
          role_code: PM
      - level: 6
        description: Bridges product and go-to-market strategy. Proactively supports
          pricing, adoption, and cross-functional alignment around value delivery.
        illustrations:
        - description: Lead by example, deliver tangible capabilty uplift across the
            organisation around Product marketing best practices.
          role_code: PM
      - level: 7
        description: Oversees the portfolio-level product marketing strategy. Ensures
          messaging, positioning, channels & timing are consistent and drives product
          performance and adoption.
      - level: 8
        description: Overall accountability on product performance & adoption.
