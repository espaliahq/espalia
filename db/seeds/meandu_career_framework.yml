  - name: Engineering Capabilities
    description:
    capabilities:
    - name: Quality First Mindset
      description: Writes clean, testable code and builds in ways that reduce risk
        and improve reliability. Aligns to our testing pyramid and contributes to
        knowledge quality through clear documentation and communicable code.
      scope:
      - Analytics Engineer
      - Data Engineer
      sheet: Data
      expectations:
      - level: 1
        description: Follows team standards for testing and documentation. Seeks feedback
          on quality.
      - level: 2
        description: "Writes well-structured, readable code and unit tests. Writes
          code and docs others can build on. \n\nExample:"
      - level: 3
        description: |-
          Takes ownership of test coverage and failure recovery. Begins contributing to shared testing patterns.

          Example: Proactively identifies and advocates for solutions to address gaps in testing patterns.
      - level: 4
        description: |-
          Improves reliability and testing discipline by actively identifying and reducing risk areas.

          Example: Leads risk reduction initiatives within custodianship to resolution with measurable impact on health metrics.
      - level: 5
        description: |-
          Leads on quality strategy across a stream. Aligns team on test coverage expectations, rollout and rollback strategies.

          Example: Sets and maintains custodianship quality standards e.g PR requirements.
      - level: 6
        description: Shapes quality assurance practices across engineering. Uplifts
          others in writing resilient, maintainable code.
      - level: 7
        description: Drives a quality culture across functions. Embeds continuous
          improvement in how we build and release software.
      - level: 8
        description: Sets engineering-wide standards for code quality and test strategy.
          Embeds long-term quality thinking into our delivery culture.
    - name: System Design & Architecture
      description: Designs components and systems that are scalable, maintainable,
        cost-effective, and aligned with long-term product direction, engineering
        principles, and technical vision.
      scope: Data Engineer
      sheet: Data
      expectations:
      - level: 1
        description: Builds within existing patterns and guidance. Understands how
          components fit into the broader system.
      - level: 2
        description: |-
          Contributes to solution design discussions. Can implement features with guidance and clear expectations.

          Example: Provides feedback and comments on design documentation.
      - level: 3
        description: |-
          Designs moderately complex features or systems. Considers performance, reusability, and long-term maintainability.

          Example: Independently researches, proposes and writes design documentation and proactively seeking feedback.
      - level: 4
        description: |-
          Owns the solution design for an initiative. Evaluates trade-offs and aligns design with product and technical goals.

          Example: Proactively engages stakeholders (both technical and cross functional) to validate ideas, evolve designs and make necessary trade off decisions.
      - level: 5
        description: |-
          Leads system-level design across multiple components or domains. Champions alignment with engineering principles.

          Example: Leveraging knowledge and experience working across the product to identify opportunities ............
      - level: 6
        description: Connects system architecture to business value. Guides teams
          in designing scalable, future-fit systems.
      - level: 7
        description: Shapes technical direction across platforms or domains. Solves
          cross-cutting system design challenges.
      - level: 8
        description: Drives architectural strategy for the organisation. Ensures scalable,
          coherent systems that enable product and business growth.
    - name: DevSecOps (Development, Security & Operations) Mindset
      description: Takes ownership of the operational health and security of the systems
        they build. Supports delivery through tooling, observability, and automation.
      scope: Data Engineer
      sheet: Data
      expectations:
      - level: 1
        description: Follows established operational and security practices. Flags
          concerns or incidents promptly.
      - level: 2
        description: |-
          Implements logging, tracing, and alerting based on team standards. Begins contributing to infrastructure or pipelines.

          Example: Accurately capture events (e.g failure scenarios) with playbook on how to diagnose and fix.
      - level: 3
        description: |-
          Understands and applies secure coding practices. Supports basic debugging, monitoring, and recovery efforts.

          Example: Proactively identifying production incidents and contributing to resolution through captured data (e.g logs) analysis.
      - level: 4
        description: |-
          Owns operational readiness and playbook completeness for their services. Contributes to CI/CD, on-call rotations, and system observability.

          Example: Has deep understanding of technologies used to enable CI/CD to ensure your stream is leveraging this to its full extent.
      - level: 5
        description: Improves team velocity by leading operational improvements. Manages
          system reliability and security for a product area.
      - level: 6
        description: Drives automation, incident response, and tooling across a stream.
          Champions operational maturity.
      - level: 7
        description: Shapes DevSecOps practices across the engineering organisation.
          Embeds operational excellence into team culture and delivery systems.
      - level: 8
        description: Leads organisational strategy for secure, scalable, and automated
          operations. Integrates delivery and ops for long-term business resilience.
    - name: 'Technical Expertise: Cloud Architecture & Infrastructure'
      description: Designs, implements, and manages scalable, secure, and cost-effective
        cloud solutions that support continuous innovation and operational efficiency.
      scope: Data Engineer
      sheet: Data
      expectations:
      - level: 1
        description: Understands basic concepts of cloud-hosted environments. Can
          deploy or test features in cloud staging environments.
      - level: 2
        description: Uses cloud services within documented patterns. Flags reliability,
          cost, or deployment concerns when needed.
      - level: 3
        description: Designs simple infrastructure-as-code deployments and configurations.
          Understands platform trade-offs.
      - level: 4
        description: Implements cloud solutions that are secure, reliable, and observable.
          Considers scaling, cost, and maintenance.
      - level: 5
        description: Designs and optimises infrastructure for business-critical systems.
          Advises others on cloud choices and architecture.
      - level: 6
        description: Leads platform evolution across teams. Anticipates cloud risks
          and plans for growth, compliance, and cost-efficiency.
      - level: 7
        description: Shapes our long-term cloud architecture strategy. Aligns platform
          design with company-wide technology goals.
      - level: 8
        description: Drives innovation and resilience through infrastructure leadership.
          Future-proofs our systems and delivery platform at scale.
  - name: Data Capabilities
    description:
    capabilities:
    - name: Data Modelling & Architecture
      description: Designs and builds a scalable, well-defined data warehouse that
        serves as the performant and trusted foundation for all analytics.
      scope:
      - Analytics Engineer
      - Data Engineer
      sheet: Data
      expectations:
      - level: 1
        description: Understands and applies established data modeling patterns, articulating
          the reasoning behind them and suggesting minor improvements to existing
          schemas.
      - level: 2
        description: Independently implements new, well-defined data models (e.g.,
          dimensions, facts) following team conventions and best practices for structure
          and testing.
      - level: 3
        description: Leads the data model design for a complex feature or project,
          ensuring the new models are well-integrated, scalable, and meet stakeholder
          needs.
      - level: 4
        description: Designs and owns the end-to-end data architecture for a major
          business domain (e.g., Finance, Marketing), establishing the canonical source
          of truth for that area.
      - level: 5
        description: Creates and socialises new architectural patterns and sets the
          company’s core data modeling strategy (e.g., choosing between Kimball, Data
          Vault, or hybrid approaches).
      - level: 6
        description: Drives data architecture strategy across multiple business domains,
          influencing upstream product and service design to ensure data is generated
          in a well-structured way.
      - level: 7
        description: Designs and evolves the company's core data architecture to support
          future business strategies, making foundational decisions that enable new
          capabilities across analytics, ML, and operations.
      - level: 8
        description: Shapes the long-term vision for the company's entire data ecosystem,
          driving industry-leading innovation in data architecture and acting as the
          final authority on major architectural decisions.
    - name: Data Quality & Governance
      description: Champions trust in our data by implementing and advocating for
        robust testing, documentation, and governance practices.
      scope:
      - Analytics Engineer
      - Data Engineer
      sheet: Data
      expectations:
      - level: 1
        description: Uses established data tests (e.g., not_null, unique) on new models.
          Investigates test failures with guidance.
      - level: 2
        description: Designs and implements custom, business-logic-specific tests
          that go beyond standard checks. Proactively identifies and resolves quality
          issues within a project's scope.
      - level: 3
        description: Owns the data quality and governance for a critical business
          domain. Leads the implementation of new governance tools or processes (e.g.,
          data catalog) within that domain.
      - level: 4
        description: Defines and implements the company's data quality and testing
          strategy. Builds scalable, automated systems for monitoring and alerting
          on data quality issues across the platform.
      - level: 5
        description: Establishes and leads a cross-functional Data Governance committee,
          fostering a culture of shared ownership and accountability for data quality
          across the business.
      - level: 6
        description: Drives the integration of data governance directly into the engineering
          lifecycle ("governance-as-code"), making quality a proactive, automated
          part of development rather than a reactive process.
      - level: 7
        description: Leads the company's strategy for complex governance areas like
          data privacy, security, and ethics. Designs architectural patterns and policies
          to ensure compliance and mitigate risk.
      - level: 8
        description: Shapes the company’s long-term vision for data trust and ethics,
          leveraging governance as a strategic advantage. Acts as an industry thought
          leader on responsible data management.
    - name: Analytics Enablement & BI Tooling
      description: Empowers analysts and business users with self-service analytics
        by providing intuitive data models and performant BI tool experiences.
      scope: Analytics Engineer
      sheet: Data
      expectations:
      - level: 1
        description: Connects a new, clean data source to the BI tool. Builds a basic
          dashboard from an existing data model.
      - level: 2
        description: Optimizes a slow dashboard by improving the underlying data model
          or query performance. Gathers requirements from analysts for a new data
          source.
      - level: 3
        description: Designs and curates a certified set of data sources in the BI
          tool, empowering stakeholders to confidently build their own reports.
      - level: 4
        description: Owns the relationship with the BI tool vendor and drives the
          internal strategy for its use. Coaches analysts on how to use data models
          effectively.
      - level: 5
        description: Leads initiatives to scale self-service analytics across the
          entire company, enabling a true data-informed culture.
    - name: 'Technical Expertise: Code Quality & Data Transformation (dbt)'
      description: Writes clean, efficient, and well-tested data transformation code
        that is reliable, maintainable, and easy for others to understand and build
        upon.
      scope: Analytics Engineer
      sheet: Data
      expectations:
      - level: 1
        description: Writes straightforward SQL transformations following team style
          guides. Adds comments to their code to explain logic.
      - level: 2
        description: Refactors complex SQL into modular, reusable CTEs. Adds custom
          tests to their dbt models to validate business logic.
      - level: 3
        description: Establishes coding best practices and style guides for the team's
          dbt project. Implements CI/CD workflows to automate testing and deployment.
      - level: 4
        description: Mentors team members on advanced dbt usage and software engineering
          principles (e.g., modularity, DRY). Drives improvements to the performance
          and cost-efficiency of dbt runs.
      - level: 5
        description: Drives the technical evolution of the data transformation stack,
          evaluating and introducing new tools and methodologies that improve leverage.
    - name: 'Technical Expertise: Data Platform & Pipeline Development'
      description: Builds and evolves the foundational infrastructure for collecting,
        storing, and moving data across the company.
      scope: Data Engineer
      sheet: Data
      expectations:
      - level: 1
        description: Uses established tools (e.g., Airflow) to make minor modifications
          to an existing data pipeline.
      - level: 2
        description: Builds and deploys new batch data pipelines from standard sources
          using established patterns, ensuring they are tested and documented.
      - level: 3
        description: Designs and implements pipelines from complex or non-standard
          sources, creating reusable patterns for extraction and transformation that
          can be adopted by others.
      - level: 4
        description: Owns and evolves core components of the data platform (e.g.,
          the workflow orchestrator), improving their functionality, cost-efficiency,
          and user experience for engineers.
      - level: 5
        description: Leads the architecture and cross-functional delivery of new,
          complex data systems (e.g., a real-time streaming platform), setting the
          technical direction and ensuring successful adoption.
      - level: 6
        description: Drives the long-term technical strategy for a major platform
          domain (e.g., all batch processing systems), influencing other teams to
          adopt patterns that improve platform-wide cost, security, and scalability.
      - level: 7
        description: Shapes the long-term vision and strategy for the entire data
          platform, ensuring it acts as a strategic business enabler. Makes the final
          call on critical technology and architecture decisions (e.g., Data Lake
          vs. Lakehouse).
      - level: 8
        description: Drives industry-leading innovation in data platform architecture
          and practice, creating a significant competitive advantage for the company.
          Represents the company as a technical authority in the broader data community.
  - name: Role Specific
    description:
    capabilities:
    - name: System Design & Architecture
      description: Designs components and systems that are scalable, maintainable,
        cost-effective, and aligned with long-term product direction, engineering
        principles, and technical vision.
      scope: Software Engineer
      sheet: Software Engineering
      expectations:
      - level: 1
        description: Builds within existing patterns and guidance. Understands how
          components fit into the broader system.
      - level: 2
