      - level: 8
        description: Helps define me&u’s market position and long-term strategic bets.
          Fosters a culture of commercial awareness across the organisation.
        illustrations:
        - description: Shapes category narrative and ecosystem strategy, evaluates
            partners, and positions me&u to lead where the market is heading, not
            just where it is.
          role_code: PM
    - name: Prioritisation for Impact
      description: Applies structured thinking to prioritise work based on value,
        effort, risk, and timing. Focuses the team on delivering meaningful outcomes.
      scope: leadership
      expectations:
      - level: 1
        description: Understands current team priorities and focuses on delivering
          their part.
        illustrations:
        - description: Clarifies what's most important before starting work. Stays
            aligned with scope and avoids overdesigning beyond what’s needed.
          role_code: PD
      - level: 2
        description: Makes sensible trade-offs with guidance. Understands how their
          work ladders up to team goals.
        illustrations:
        - description: With support, balances polish with progress. Makes decisions
            that keep workflows moving while still meeting design and user needs.
          role_code: PD
        - description: Ability to gather information and inputs to make informed feature
            prioritisation decisions.
          role_code: PM
      - level: 3
        description: Identifies dependencies and constraints. Makes small scope adjustments
          to keep things moving.
        illustrations:
        - description: Considers time, technical constraints, and user value to guide
            what gets designed and refined. Communicates rationale for design choices.
          role_code: PD
        - description: Ability to gather information and inputs to make informed product
            strategy & execution decisions.
          role_code: PM
      - level: 4
        description: Uses prioritisation frameworks or criteria to guide decision-making.
          Balances competing inputs effectively.
        illustrations:
        - description: 'E4/EM4: Leverages qualitative and quantitative criteria in
            their priorisation decision'
          role_code: E
        - description: 'E4/EM4: Leverages qualitative and quantitative criteria in
            their priorisation decision'
          role_code: EM
        - description: Applies structured thinking to help prioritise design effort.
            Guides others to balance vision with delivery.
          role_code: PD
        - description: Using strong commercial understanding to drive and influence
            prioritisation efforts and decisions. Accountability for technology investment
            ROI.
          role_code: PM
      - level: 5
        description: Leads teams through complex prioritisation decisions. Manages
          scope with transparency and alignment.
        illustrations:
        - description: 'E5/EM5: Understands Cost of Delay, applies that thinking to
            their priotisation'
          role_code: E
        - description: 'E5/EM5: Understands Cost of Delay, applies that thinking to
            their priotisation'
          role_code: EM
        - description: Facilitates trade-off discussions across stakeholders. Prioritises
            design work that moves key metrics or unblocks major user pain points.
          role_code: PD
        - description: Soft commercial ownership responsibilities tied to a sigificant
            product area, contributes to the overall P&L of me&u.
          role_code: PM
      - level: 6
        description: Aligns teams on shared priorities. Resolves conflicts and balances
          long-term vs short-term value.
        illustrations:
        - description: Cuts through noise to guide teams toward the highest-value
            design problems. Ensures design time is spent where it matters most.
          role_code: PD
        - description: Direct commercial accountability over a significant product
            area, P&L responsibilities.
          role_code: PM
      - level: 7
        description: Shapes prioritisation at the strategic level. Guides investments
          in capabilities, platforms, or products over time.
        illustrations:
        - description: Works with product and tech leaders to prioritise high-impact
            design initiatives. Clarifies what not to do to protect focus and design
            quality.
          role_code: PD
        - description: Oversees the investment and ROI performance across the product
            porfolio.
          role_code: PM
      - level: 8
        description: Builds a culture of value-based prioritisation across the organisation.
          Ensures we focus on what matters most, at scale.
        illustrations:
        - description: Defines company investment frameworks and thresholds, enforces
            focus, and ensures technology investments flow to the bets with the highest
            strategic and financial leverage.
          role_code: PM
    - name: Planning & Delivery
      description: Drives delivery and shared understanding through effective planning,
        documentation, and rituals. Creates clarity and rhythm across teams.
      scope: leadership
      expectations:
      - level: 1
        description: Attends planning and team rituals. Understands how tasks are
          broken down and tracked.
        illustrations:
        - description: Participates in sprint planning, retros, and design stand-ups.
            Understands what design work is coming up and how it connects to delivery.
          role_code: PD
      - level: 2
        description: Contributes to project reviews or planning. Communicates progress
          and blockers reliably.
        illustrations:
        - description: 'E2: Project reviews include backlog refinement.'
          role_code: E
        - description: 'E2: Project reviews include backlog refinement.'
          role_code: EM
        - description: Helps estimate effort for design tasks. Breaks work into manageable
            chunks and plans around delivery timelines with support.
          role_code: PD
        - description: Ability to facilitate ongoing planning processes.
